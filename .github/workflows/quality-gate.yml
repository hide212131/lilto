name: Quality Gate

on:
  push:
  pull_request:

jobs:
  typecheck-and-unit:
    name: Typecheck and unit test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      LILTO_NATIVE_BUILD_REQUIRED: "1"
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust toolchain (Windows)
        uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'

      - name: Install npm dependencies
        run: npm.cmd ci
        if: runner.os == 'Windows'

      - name: Install npm dependencies
        run: npm ci
        if: runner.os != 'Windows'

      - name: Download Electron runtime (Windows)
        run: npx.cmd install-electron --no
        if: runner.os == 'Windows'

      - name: Download Electron runtime
        run: npx install-electron --no
        if: runner.os != 'Windows'

      - name: Build native helpers (Windows)
        run: npm.cmd run build:native
        if: runner.os == 'Windows'

      - name: Build native helpers
        run: npm run build:native
        if: runner.os != 'Windows'

      - name: TypeScript noEmit check
        run: npx.cmd tsc --noEmit -p tsconfig.json
        if: runner.os == 'Windows'

      - name: TypeScript noEmit check
        run: npx tsc --noEmit -p tsconfig.json
        if: runner.os != 'Windows'

      - name: Renderer-free unit tests
        run: npm.cmd run test:unit
        if: runner.os == 'Windows'

      - name: Renderer-free unit tests
        run: npm run test:unit
        if: runner.os != 'Windows'

  app-server-instruction-contract:
    name: App Server instruction lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm.cmd ci
        if: runner.os == 'Windows'

      - name: Install npm dependencies
        run: npm ci
        if: runner.os != 'Windows'

      - name: Build unit output
        run: npm.cmd run build:unit
        if: runner.os == 'Windows'

      - name: Build unit output
        run: npm run build:unit
        if: runner.os != 'Windows'

      # Bundled App Server + local recording server: no model, no auth, no network. Counts the browser-state
      # items in the model input, restart / failure / compaction / same-thread-conflict behavior.
      - name: Verify instruction lifecycle against the bundled App Server
        run: npm.cmd run verify:instruction-lifecycle
        if: runner.os == 'Windows'

      - name: Verify instruction lifecycle against the bundled App Server
        run: npm run verify:instruction-lifecycle
        if: runner.os != 'Windows'

      - name: Upload lifecycle result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instruction-lifecycle-${{ matrix.os }}
          path: test/artifacts/instruction-lifecycle/result.json
          if-no-files-found: warn

  # Issue #42: operations while the window is minimized / unfocused / covered, on a real Electron. Hosted runners
  # have a desktop session on both OSes; the verification itself confirms a native minimize (event + isMinimized),
  # so a runner that cannot minimize fails here instead of silently passing as a normal-visibility run.
  # Lock / display-off / real taskbar or Dock interaction cannot be reproduced on hosted runners: those are
  # covered by the manual live verification on an interactive machine (see the OpenSpec change tasks).
  minimized-browser-operations:
    name: Minimized browser operations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Owner decision (2026-11-14): the Windows leg is informational only. On GitHub-hosted Windows runners a
    # minimized window's compositor presents frozen frames (the capture stays at the pre-change pixels no matter
    # what the page does), so the screenshot-freshness checks cannot pass there even though the same build passes
    # 146/146 on an interactive Windows desktop. Frame arrival and dirtyRect cannot distinguish the frozen runner
    # surface from a live one (fix rounds 4-7, PR #45). The authoritative Windows gate is therefore the
    # interactive real-machine verification; this leg still runs and uploads its evidence on every change.
    # The macOS leg remains a required gate.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm.cmd ci
        if: runner.os == 'Windows'

      - name: Install npm dependencies
        run: npm ci
        if: runner.os != 'Windows'

      - name: Download Electron runtime (Windows)
        run: npx.cmd install-electron --no
        if: runner.os == 'Windows'

      - name: Download Electron runtime
        run: npx install-electron --no
        if: runner.os != 'Windows'

      # Facts only (input landing, capture freshness, timers/rAF while minimized); never fails the job.
      - name: Probe minimized-window behavior
        continue-on-error: true
        timeout-minutes: 5
        run: npm.cmd run probe:minimized-browser
        if: runner.os == 'Windows'

      - name: Probe minimized-window behavior
        continue-on-error: true
        timeout-minutes: 5
        run: npm run probe:minimized-browser
        if: runner.os != 'Windows'

      # LILTO_VERIFY_WATCHDOG_MS: the script's own watchdog force-exits well before this step timeout,
      # so a hang is reported with the last check reached instead of being cut off blind by the runner.
      - name: Verify minimized operations on a real Electron (Windows)
        run: npm.cmd run verify:minimized-browser
        env:
          LILTO_MIN_SOAK_MS: "60000"
        timeout-minutes: 12
        if: runner.os == 'Windows'

      - name: Verify minimized operations on a real Electron
        run: npm run verify:minimized-browser
        env:
          LILTO_MIN_SOAK_MS: "60000"
        timeout-minutes: 12
        if: runner.os != 'Windows'

      # Real Lit renderer + real Main: opening the panel while minimized and restoring (native BrowserWindow.minimize()).
      - name: Verify minimized panel on the real UI (Windows)
        run: npm.cmd run verify:minimized-ui
        timeout-minutes: 5
        if: runner.os == 'Windows'

      - name: Verify minimized panel on the real UI
        run: npm run verify:minimized-ui
        timeout-minutes: 5
        if: runner.os != 'Windows'

      - name: Upload minimized-window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimized-browser-${{ matrix.os }}
          path: |
            test/artifacts/probe-minimized-browser.json
            test/artifacts/verify-embedded-browser.json
            test/artifacts/verify-minimized-ui.json
            test/artifacts/verify-minimized-ui-host.png
          if-no-files-found: warn

  electron-e2e:
    name: Electron UI regression
    runs-on: macos-latest
    env:
      LILTO_NATIVE_BUILD_REQUIRED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Download Electron runtime
        run: npx install-electron --no

      - name: Build native helpers
        run: npm run build:native

      - name: Run Electron UI regression
        run: npm run e2e:electron

      - name: Verify E2E screenshot
        run: test -s test/artifacts/electron-e2e.png

      - name: Upload E2E screenshot
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-screenshot
          path: test/artifacts/electron-e2e.png
          if-no-files-found: error
